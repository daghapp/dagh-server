name: Keep production warm

# Render free-tier web services spin down after ~15 minutes without traffic,
# which makes the first App Review request wait through a cold start (F-025).
# A 5-minute ping keeps the instance up. Scheduled GitHub Actions can be
# delayed, so this is a mitigation, not a guarantee — use a paid instance for
# the review window if cold starts still appear.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.diasporansync.com' }}
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 120 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$API_URL/health"
