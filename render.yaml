services:
  - type: web
    name: dagh-server
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://dagh-server-fo64.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://dagh-server-fo64.onrender.com
