services:
  - type: web
    name: dagh-server
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENTS_ENABLED
        value: "true"
      - key: API_URL
        value: https://dagh-server-fo64.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://dagh-server-fo64.onrender.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
