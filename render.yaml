services:
  - type: web
    name: dagh-server
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENTS_ENABLED
        value: "true"
      - key: API_URL
        value: https://dagh-server-fo64.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://dagh-server-fo64.onrender.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      # YouTube subscription verification. Without CLIENT_ID/CLIENT_SECRET the
      # gate fails closed and POST /community/videos/:videoId/subscribe-intent
      # answers 503 YOUTUBE_VERIFICATION_NOT_CONFIGURED for every user.
      - key: YOUTUBE_OAUTH_CLIENT_ID
        sync: false
      - key: YOUTUBE_OAUTH_CLIENT_SECRET
        sync: false
      # Must match the redirect URI registered for this OAuth client in the
      # Google Cloud Console, or the token exchange fails at the callback.
      - key: YOUTUBE_OAUTH_REDIRECT_URI
        value: https://dagh-server-fo64.onrender.com/community/youtube/callback
      # Public channel id, so channel resolution needs no API call and no key.
      - key: YOUTUBE_CHANNEL_ID
        value: UCj8dtl0Hf6AZIlfDIq7fHAg
      # Still needed by the admin channel-sync endpoint (uploads playlist fetch).
      - key: YOUTUBE_API_KEY
        sync: false
      # Sender identity for all outgoing Resend email. The domain must be
      # verified in the Resend dashboard before production sends will succeed.
      - key: EMAIL_FROM
        value: "Diaspora Affairs Ghana <noreply@diasporaadvocacygh.org>"
