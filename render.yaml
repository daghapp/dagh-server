services:
  - type: web
    name: dagh-server
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Render uses this for zero-downtime deploys and keeps the instance marked
    # healthy. The endpoint is DB-free, so it stays cheap during cold starts.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENTS_ENABLED
        value: "true"
      # Required at boot (src/helpers/jwt.ts throws without it). Distinct
      # from JWT_ACCESS_SECRET; signs the pre-2FA admin MFA token.
      # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: JWT_MFA_SECRET
        sync: false
      - key: API_URL
        value: https://dagh-server-fo64.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://dagh-server-fo64.onrender.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      # YouTube subscription verification. Without CLIENT_ID/CLIENT_SECRET the
      # gate fails closed and POST /community/videos/:videoId/subscribe-intent
      # answers 503 YOUTUBE_VERIFICATION_NOT_CONFIGURED for every user.
      - key: YOUTUBE_OAUTH_CLIENT_ID
        sync: false
      - key: YOUTUBE_OAUTH_CLIENT_SECRET
        sync: false
      # Must match the redirect URI registered for this OAuth client in the
      # Google Cloud Console, or the token exchange fails at the callback.
      - key: YOUTUBE_OAUTH_REDIRECT_URI
        value: https://dagh-server-fo64.onrender.com/community/youtube/callback
      # Public channel id, so channel resolution needs no API call and no key.
      - key: YOUTUBE_CHANNEL_ID
        value: UCj8dtl0Hf6AZIlfDIq7fHAg
      # Still needed by the admin channel-sync endpoint (uploads playlist fetch).
      - key: YOUTUBE_API_KEY
        sync: false
      # Sender identity for all outgoing Resend email. The domain must be
      # verified in the Resend dashboard before production sends will succeed.
      - key: EMAIL_FROM
        value: "Diaspora Affairs Ghana <noreply@diasporaadvocacygh.org>"
      # Apple Sign In is required by App Store Guideline 4.8 while Google and
      # Facebook remain. /auth/apple returns 503 until every value below is set.
      # Prefer APPLE_PRIVATE_KEY (the .p8 contents, with \n escapes) over a
      # mounted file; both are supported.
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: APPLE_CALLBACK_URL
        value: https://dagh-server-fo64.onrender.com/auth/apple/callback
      # App Store Guideline 3.1.1: leave false unless this build carries Apple's
      # External Purchase Link entitlement. Paid memberships are then blocked on
      # iOS while web/Android continue to use Hubtel checkout.
  - key: IOS_EXTERNAL_DIGITAL_PURCHASES
    value: "false"
  # Optional OpenSearch cluster for dating name search. Leave unset to use
  # the Postgres fallback; set NODE/USERNAME/PASSWORD to enable fuzzy search.
  - key: OPENSEARCH_NODE
    sync: false
  - key: OPENSEARCH_USERNAME
    sync: false
  - key: OPENSEARCH_PASSWORD
    sync: false
  - key: OPENSEARCH_INDEX
    value: dagh-dating-profiles
  # Android fallback used by shareable preview links when the app isn't installed.
  - key: PLAY_STORE_URL
    value: "https://play.google.com/store/search?q=Diasporan+sync&c=apps&pli=1"
