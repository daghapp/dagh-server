<!DOCTYPE html>
<html>
  <head>
    <title>Authentication Success</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        text-align: center;
        max-width: 500px;
      }
      h1 { 
        color: #27ae60; 
        margin-bottom: 20px; 
      }
      p { 
        color: #555; 
        margin-bottom: 20px; 
      }
      .token { 
        background: #f8f9fa; 
        padding: 10px; 
        border-radius: 5px; 
        word-break: break-all;
        font-size: 12px;
        margin-bottom: 15px;
        text-align: left;
      }
      .label { 
        font-weight: bold; 
        color: #333; 
        margin-bottom: 5px;
      }
      .email {
        color: #667eea;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>✅ Authentication Successful!</h1>
      <p>Welcome, <span class="email" id="userEmail"></span></p>
      <div class="label">Access Token:</div>
      <div class="token" id="accessToken"></div>
      <div class="label">Refresh Token:</div>
      <div class="token" id="refreshToken"></div>
    </div>
    <script>
      // Tokens will be injected via query params or other method
      const urlParams = new URLSearchParams(window.location.search);
      document.getElementById('userEmail').textContent = urlParams.get('email') || 'User';
      document.getElementById('accessToken').textContent = urlParams.get('accessToken') || 'N/A';
      document.getElementById('refreshToken').textContent = urlParams.get('refreshToken') || 'N/A';
    </script>
  </body>
</html>
