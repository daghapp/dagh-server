<!DOCTYPE html>
<html>
  <head>
    <title>Diaspora Sync Sign In</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        text-align: center;
        max-width: 420px;
      }
      h1 {
        color: #27ae60;
        margin-bottom: 20px;
      }
      p {
        color: #555;
        margin-bottom: 20px;
      }
      .app-link {
        display: inline-block;
        padding: 14px 32px;
        background: #d9750b;
        color: white;
        text-decoration: none;
        font-weight: bold;
        border-radius: 30px;
        transition: background 0.3s;
        margin-top: 6px;
      }
      .app-link:hover {
        background: #b25f08;
      }
      .sub {
        font-size: 13px;
        color: #888;
        margin-top: 22px;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Signed In</h1>
      <p>You are signed in to <strong>Diaspora Sync</strong>.</p>
      <a class="app-link" href="diasporansync:///oauth">Open Diaspora Sync</a>
      <p class="sub">If the app does not open, launch it manually and keep this tab open.</p>
    </div>
  </body>
</html>
